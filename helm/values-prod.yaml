# Cloud / production overrides. Use with:
#   helm install dclaw-wiki ./helm -n <ns> -f values-prod.yaml

backend:
  image:
    repository: ghcr.io/dclawstack/dclaw-wiki-backend
    tag: latest
    pullPolicy: IfNotPresent

frontend:
  image:
    repository: ghcr.io/dclawstack/dclaw-wiki-frontend
    tag: latest
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP

ingress:
  enabled: true
  className: nginx
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
  host: wiki.dclawstack.io
  tls:
    - secretName: dclaw-wiki-tls
      hosts:
        - wiki.dclawstack.io
