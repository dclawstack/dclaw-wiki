apiVersion: apps/v1
kind: Deployment
metadata:
  name: dclaw-wiki-frontend
  namespace: dclaw-core
  labels:
    app.kubernetes.io/name: dclaw-wiki
    app.kubernetes.io/part-of: dclaw-platform
    app.kubernetes.io/component: frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: dclaw-wiki
  template:
    metadata:
      labels:
        app.kubernetes.io/name: dclaw-wiki
        app.kubernetes.io/part-of: dclaw-platform
        app.kubernetes.io/component: frontend
    spec:
      containers:
        - name: frontend
          image: docker.io/library/dclaw-wiki-frontend:local
          imagePullPolicy: Never
          ports:
            - containerPort: 3048
              name: http
          env:
            - name: PORT
              value: "3048"
            # Server-side rewrite + SSR fetch target (next.config.js, lib/api.ts).
            - name: BACKEND_URL
              value: "http://dclaw-wiki-backend:8113"
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: "50m"
              memory: "128Mi"
            limits:
              cpu: "200m"
              memory: "256Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: dclaw-wiki
  namespace: dclaw-core
  labels:
    app.kubernetes.io/name: dclaw-wiki
    app.kubernetes.io/part-of: dclaw-platform
    app.kubernetes.io/component: frontend
spec:
  type: NodePort
  ports:
    - port: 3048
      targetPort: http
      nodePort: 30048
      name: http
  selector:
    app.kubernetes.io/name: dclaw-wiki
