# dpanel app-registry entry for DClaw Wiki.
#
# The live `dclaw-apps-registry` ConfigMap in dclaw-core holds one JSON key
# per enabled app. To enable WITHOUT clobbering the other apps' keys, apply
# this as a strategic/merge patch (a full `kubectl apply` of a ConfigMap
# would drop keys not present here):
#
#   kubectl patch configmap dclaw-apps-registry -n dclaw-core --type merge \
#     -p '{"data":{"wiki":"<single-line JSON>"}}'
#
apiVersion: v1
kind: ConfigMap
metadata:
  name: dclaw-apps-registry
  namespace: dclaw-core
  labels:
    managed-by: dclaw-operator
    component: dpanel-registry
    app.kubernetes.io/name: dclaw-apps-registry
    app.kubernetes.io/part-of: dclaw-platform
data:
  wiki: |
    {"appId":"wiki","appName":"DClaw Wiki","appIcon":"BookOpen","category":"Productivity","version":"1.0.0","primaryColor":"#14B8A6","path":"/app/wiki","tier":"free","status":"ready","url":"http://localhost:30048"}
